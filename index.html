<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PTM Help Terminal - Select Class</title>
<style>
  body {
    margin:0;
    background: linear-gradient(135deg, #0077ff, #00c6ff);
    color:white;
    font-family: 'Segoe UI', sans-serif;
    display:flex; flex-direction:column; align-items:center; padding:20px;
  }
  h1 { font-size: 40px; text-shadow: 2px 2px 5px #000; }
 .terminal {
    background:white; color:#003366; padding:25px; border-radius:15px;
    width:90%; max-width:700px; box-shadow:0 0 20px rgba(0,0,0,0.4);
  }
 .btn {
    display:block; width:100%; padding:15px; margin:10px 0;
    background:#0077ff; color:white; border:none; border-radius:10px;
    font-size:18px; cursor:pointer; transition:0.2s;
  }
 .btn:hover { background:#0055cc; transform:scale(1.02); }
 .help {
    margin-top:20px; background:#e6f3ff; padding:15px; border-radius:10px; color:#003366;
  }
</style>
</head>
<body>
  <h1>🏫 PTM PARENT HELP TERMINAL</h1>

  <div class="terminal">
    <h2>Step 1: Select Your Child's Class</h2>
   
    <button class="btn" onclick="goToSection('Class 1')">Class 1</button>
    <button class="btn" onclick="goToSection('Class 2')">Class 2</button>
    <button class="btn" onclick="goToSection('Class 3')">Class 3</button>
    <button class="btn" onclick="goToSection('Class 4')">Class 4</button>
    <button class="btn" onclick="goToSection('Class 5')">Class 5</button>
    <button class="btn" onclick="goToSection('Class 6')">Class 6</button>
    <button class="btn" onclick="goToSection('Class 7')">Class 7</button>
    <button class="btn" onclick="goToSection('Class 8')">Class 8</button>
    <button class="btn" onclick="goToSection('Class 9')">Class 9</button>
    <button class="btn" onclick="goToSection('Class 10')">Class 10</button>
    <button class="btn" onclick="goToSection('Class 11')">Class 11</button>
    <button class="btn" onclick="goToSection('Class 12')">Class 12</button>
   

    <div class="help">
      <h3>❓ HOW TO USE</h3>
      <p>1. Tap the Class of your child<br>
         2. Next page: Choose Section A, B, C etc.<br>
         3. Final page: Location will appear in BIG letters with map illustration<br>
         For help ask any student volunteer in blue badge</p>
    </div>
  </div>

<script>
function goToSection(cls){
  localStorage.setItem("selectedClass", cls);
  window.location.href = "section.html";
}
</script>
</body>
</html>
